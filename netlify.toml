[build]
  command = "npm run client:build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "24"

# The dashboard calls /api on its own origin; Netlify forwards those calls to the API on Vercel.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-VERCEL-URL.vercel.app/api/:splat"
  status = 200
  force = true
